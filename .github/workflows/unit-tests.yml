---
name: Unit Tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate and Lint (OpenVox ${{ matrix.openvox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openvox: '8.31.0'
            ruby: '3.2.11'
          - openvox: '9.1.0'
            ruby: '4.0.7'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.openvox }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Validate manifests
        run: bundle exec rake validate

      - name: Run puppet-lint
        run: bundle exec rake lint

      - name: Check syntax
        run: bundle exec rake syntax

      - name: Run rubocop
        run: bundle exec rake rubocop

  spec:
    name: Unit Tests (RSpec, OpenVox ${{ matrix.openvox }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - openvox: '8.31.0'
            ruby: '3.2.11'
          - openvox: '9.1.0'
            ruby: '4.0.7'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.openvox }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Prepare test fixtures
        run: bundle exec rake fixtures:prep

      - name: Run unit tests
        run: bundle exec rake parallel_spec

      - name: Clean up test fixtures
        if: always()
        run: bundle exec rake fixtures:clean
